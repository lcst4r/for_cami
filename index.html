<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Cami ♡</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background">

        <div class="moon-glow"></div>

        <div class="mist mist-one"></div>

        <div class="mist mist-two"></div>

        <div
            class="stars-layer"
            id="starsLayer"
        ></div>

    </div>



    <!-- =====================================================
         MAIN HALL
    ====================================================== -->

    <main class="hall">


        <!-- HEADER -->

        <header class="hall-header">

            <div class="header-stars">
                ✦ ˚ ✧ ˚ ✦
            </div>

            <p class="eyebrow">
                A LITTLE COLLECTION OF LOVE
            </p>

            <h1>
                For Cami ♡
            </h1>

            <p class="subtitle">
                A little hall of gifts for our dear girl Camellia ♡
            </p>

            <div class="header-line">

                <span></span>

                <b>✦</b>

                <span></span>

            </div>

        </header>



        <!-- =================================================
             GIFT HALL

             IMPORTANT:
             Every gift uses EXACTLY one button.
             No duplicate gift sections.
        ================================================== -->

        <section
            class="gifts"
            id="giftHall"
        >


            <!-- =================================================
                 MASHA
            ================================================== -->

            <button
                class="gift gift-masha"
                type="button"

                data-name="Masha"

                data-message="Happy birthday to our key to happiness 🔆     On this day, the world welcomes someone who brings joy to everyone without even doing anything  , Her name makes everyone eagerly anticipate her  ! 🪷        في هذا اليوم انولدت كامي الحلوة عشان تخلينا نفرح اكثر في كل مرة هي تكون موجودة بيننا  ، سبحان من سو​اها وخلاها جميلة داخليا وخارجيا، خلوقة، حنونة، لطيفة، ذكية، وجه جميل وقبول اجمل، انا سعيدة لاني اشوفك تكبري قدامي وكل مرة تصيري احلى وانجح، اسأل الله ان يخلي هاي السنة خفيفة ظريفة عليك، ويرزقك السعادة اللي تستاهليها دائماً 💓           - masha holland"

                data-image="mashagift.png"

                aria-label="Open Masha's gift"
            >

                <span class="gift-sparkle sparkle-one">
                    ✦
                </span>

                <span class="gift-sparkle sparkle-two">
                    ✧
                </span>

                <img
                    src="mashabox.png"
                    alt="Masha gift box"
                    draggable="false"
                >

            </button>



            <!-- =================================================
                 ZAHRAA
            ================================================== -->

            <button
                class="gift gift-zahraa"
                type="button"

                data-name="Zahraa"

                data-message="Happy Birthday, Camilishouti , I hope you have the best day and that this year brings you happiness, success, and beautiful memories. You deserve all the good things life has to offer. Have an amazing birthday and enjoy every moment."

                data-image="zahragift.png"

                aria-label="Open Zahraa's gift"
            >

                <span class="gift-sparkle sparkle-one">
                    ✦
                </span>

                <span class="gift-sparkle sparkle-two">
                    ✧
                </span>

                <img
                    src="zahrabox.png"
                    alt="Zahraa gift box"
                    draggable="false"
                >

            </button>



            <!-- =================================================
                 HEATHER
            ================================================== -->

            <button
                class="gift gift-heather"
                type="button"

                data-name="Heather"

                data-message="Happy birthday to the sweetest little Cami! We've been friends for such a long time that I don't even remember when our friendship started but I remember how it did, when I was the purple jisoo and u were the pink Rosé, it was one of the best things that happened to me in the fakeland. I love how we always find our ways back to each other no matter how long we separate because you're the most extraordinary girl Cami, as clear as a musical note and as sincere as a melody, you're the music that's been playing in my head since the first day we met~. I love all our memories, ships, silly little moments, our breakdowns and how we cherish each other. You really mean a lot to me and you're very special to my heart, I hope our friendship never ends and I promise I'll be there in every birthday of URS until we meet✨."

                data-image="heathergift.png"
                aria-label="Open Heather's gift"
            >

                <span class="gift-sparkle sparkle-one">
                    ✦
                </span>

                <span class="gift-sparkle sparkle-two">
                    ✧
                </span>

                <img
                    src="heatherbox.png"
                    alt="Heather gift box"
                    draggable="false"
                >

            </button>



            <!-- =================================================
                 ANGELOS
            ================================================== -->

            <button
                class="gift gift-angelos"
                type="button"

                data-name="Angelos"

                data-message="Sweetest 18 to my lovely girl <3 The caramel to my vanilla, I couldn't believe that i found you after 3 years.. I was there for u in your bday 3 years ago and it was the day we became friends, also :3 Your bday is special cuz that's the day u were born and as a bonus the day we became friends >-< Love u sm my legal adult ♡"

                data-image="angelgift.png"

                aria-label="Open Angelos' gift"
            >

                <span class="gift-sparkle sparkle-one">
                    ✦
                </span>

                <span class="gift-sparkle sparkle-two">
                    ✧
                </span>

                <img
                    src="angelbox.png"
                    alt="Angelos gift box"
                    draggable="false"
                >

            </button>



            <!-- =================================================
                 FAIRY
            ================================================== -->

            <button
                class="gift gift-fairy"
                type="button"

                data-name="Fairy"

                data-message="𝑱𝒐𝒚𝒆𝒖𝒙 𝒂𝒏𝒏𝒊𝒗𝒆𝒓𝒔𝒂𝒊𝒓𝒆 𝒎𝒂 𝒑𝒓𝒊𝒏𝒄𝒆𝒔𝒔𝒆 𝑪𝒂𝒎𝒊, 𝒋’𝒕𝒆 𝒔𝒐𝒖𝒉𝒂𝒊𝒕𝒆 𝒖𝒏𝒆 𝒏𝒐𝒖𝒗𝒆𝒍𝒍𝒆 𝒂𝒏𝒏é𝒆 𝒑𝒍𝒆𝒊𝒏𝒆 𝒅𝒆 𝒃𝒐𝒏𝒉𝒆𝒖𝒓, 𝒔𝒂𝒏𝒔 𝒑𝒓𝒊𝒔𝒆 𝒅𝒆 𝒕ê𝒕𝒆 𝒆𝒕 𝒓𝒆𝒎𝒑𝒍𝒊𝒆 𝒅𝒆 𝒓é𝒖𝒔𝒔𝒊𝒕𝒆𝒔 𝒒𝒖𝒊 𝒕𝒆 𝒓𝒆𝒏𝒅𝒓𝒐𝒏𝒕 𝒉𝒆𝒖𝒓𝒆𝒖𝒔𝒆 𝒆𝒕 𝒒𝒖𝒊 𝒏𝒐𝒖𝒔 𝒇𝒆𝒓𝒐𝒏𝒕 𝒑𝒍𝒂𝒊𝒔𝒊𝒓 à 𝒏𝒐𝒖𝒔 𝒂𝒖𝒔𝒔𝒊, 𝒋’𝒔𝒖𝒊𝒔 𝒗𝒓𝒂𝒊𝒎𝒆𝒏𝒕 𝒕𝒓𝒐𝒑 𝒄𝒐𝒏𝒕𝒆𝒏𝒕𝒆 𝒅𝒆 𝒕𝒆 𝒄𝒐𝒏𝒏𝒂î𝒕𝒓𝒆 𝒆𝒕 𝒅𝒆 𝒑𝒐𝒖𝒗𝒐𝒊𝒓 𝒕𝒆 𝒔𝒐𝒖𝒉𝒂𝒊𝒕𝒆𝒓 𝒕𝒐𝒏 𝒂𝒏𝒏𝒊𝒗 ♡."

                data-image="fairygift.png"

                aria-label="Open Fairy's gift"
            >

                <span class="gift-sparkle sparkle-one">
                    ✦
                </span>

                <span class="gift-sparkle sparkle-two">
                    ✧
                </span>

                <img
                    src="fairybox.png"
                    alt="Fairy gift box"
                    draggable="false"
                >

            </button>



            <!-- =================================================
                 ELLARA
            ================================================== -->

            <button
                class="gift gift-ellara"
                type="button"

                data-name="Ellara"

                data-message="my sweet cami and my forever after best friend and my pink bunny princess beauty belle golden shiny lady, today is the day you were born and without you I'd be soooo lonely, you're the only thing I'm so scared to lose and I can't wait to see you one day, I hope all the good things come for you and I just wanted you to know that no matter what you'll always be my favorite person and no one will replace your place in my heart, I never told you that and you don't know how much I adore you cause you're the prettiest girl I've ever seen and I'll be on your side in the worst days, on the happiest days in your life, I'll be there any time you need me and if you wanted the moon I'll learn to fly and I mean it because you deserve the moon and the sun and all the stars and the whole planet system, I hope you succeed this school year and get the best grades as you wish and I know you can do it because that's you duh, you always get what you want, I always see you as my sunshine because since you came into my life I've never been happier, you always take care of me and make sure I'm okay, you hate the people I hate and accept me as who I am not the version of me that everyone see in public, you're the most precious thing and I hope we stay friends forever even after death, enjoy your birthday caramel ⊹ ࣪ ˖"

                data-image="mygift.png"

                aria-label="Open Ellara's gift"
            >

                <span class="gift-sparkle sparkle-one">
                    ✦
                </span>

                <span class="gift-sparkle sparkle-two">
                    ✧
                </span>

                <img
                    src="mybox.png"
                    alt="Ellara gift box"
                    draggable="false"
                >

            </button>



            <!-- =================================================
                 NARI
            ================================================== -->

            <button
                class="gift gift-nari"
                type="button"

                data-name="Nari"

                data-message="كامي حلوتي جميلتي المزة العسولة عيد ميلاد سعيد كل عام وانتِ بخير اتمنالك كل الفرح و السعادة الله يخليك لي واشوفك محققة كل احلامك وبيجي اليوم يلي نلتقي فيه وبعيطك اقوى حضن وبوسات يا اجمل والطف واحن مغربية قابلتها فحياتي فخورة انك صديقتي وماندمت اني تعرفت عليكِ ابدا بحبك"

                data-image="narigift.png"

                aria-label="Open Nari's gift"
            >

                <span class="gift-sparkle sparkle-one">
                    ✦
                </span>

                <span class="gift-sparkle sparkle-two">
                    ✧
                </span>

                <img
                    src="naribox.png"
                    alt="Nari gift box"
                    draggable="false"
                >

            </button>


        </section>



        <!-- =================================================
            HINT
        ================================================== -->

        <div class="hall-hint">

            <span>✦</span>

            <span>
                choose a gift to discover the little surprise
            </span>

            <span>✦</span>

        </div>


    </main>



    <!-- =====================================================
         GIFT CARD OVERLAY
    ====================================================== -->

    <div
        class="card-overlay"
        id="cardOverlay"
        aria-hidden="true"
    >


        <!-- BACKDROP -->

        <div class="card-backdrop"></div>



        <!-- =================================================
             CARD
        ================================================== -->

        <article
            class="gift-card"
            id="giftCard"
        >


            <!-- CLOSE -->

            <button
                class="close-card"
                id="closeCard"
                type="button"
                aria-label="Close gift"
            >
                ×
            </button>



            <!-- TOP DECORATION -->

            <div class="card-decoration">

                <span>✦</span>

                <span>♡</span>

                <span>✦</span>

            </div>



            <!-- FROM -->

            <p class="card-label">
                A LITTLE GIFT FROM
            </p>



            <!-- NAME -->

            <h2 id="friendName">
                Masha
            </h2>



            <div class="name-line">

                <span></span>

                <b>♡</b>

                <span></span>

            </div>



            <!-- =================================================
                 IMAGE
            ================================================== -->

            <div class="card-image-area">

                <div class="card-image-glow"></div>

                <div
                    class="image-loading"
                    id="imageLoading"
                >
                    ✦ opening your surprise... ✦
                </div>

                <img
                    id="giftImage"
                    class="gift-image"
                    src=""
                    alt="Gift"
                    draggable="false"
                >

            </div>



            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div class="message-box">

                <div class="message-symbol">
                    ❦
                </div>

                <p
                    id="friendMessage"
                    class="friend-message"
                ></p>

                <span
                    id="typingCursor"
                    class="typing-cursor"
                ></span>

            </div>



            <!-- FOOTER -->

            <div class="card-footer">

                <span>
                    made with love
                </span>

                <span>
                    ♡
                </span>

            </div>


        </article>


    </div>



    <!-- =====================================================
         MAGIC PARTICLES
    ====================================================== -->

    <div
        id="celebrationLayer"
        class="celebration-layer"
    ></div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
